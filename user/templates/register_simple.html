{% extends "base.html" %}

{% load static %}

{% block title %}注册{% endblock title %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2 class="mt-5 mb-3">注册</h2>
            <form method="post" action="." class="form" id="signup_form">
                {% csrf_token %}
                
                <div class="form-group">
                    <label for="id_username">用户名:</label>
                    <input type="text" name="username" class="form-control" id="id_username" required>
                </div>
                
                <div class="form-group">
                    <label for="id_email">邮箱:</label>
                    <input type="email" name="email" class="form-control" id="id_email" required>
                </div>
                
                <div class="form-group">
                    <label for="id_password">密码:</label>
                    <input type="password" name="password" class="form-control" id="id_password" required>
                </div>
                
                <div class="form-group">
                    <label for="id_password2">确认密码:</label>
                    <input type="password" name="password2" class="form-control" id="id_password2" required>
                </div>

                <!-- 错误消息显示 -->
                {% for field in form %}
                {% if field.errors %}
                <div class="alert alert-danger" role="alert">
                    {{ field.errors }}
                </div>
                {% endif %}
                {% endfor %}

                <div class="text-center mt-3">
                    <button type="submit" class="btn btn-primary btn-block">提交</button>
                </div>
            </form>
            <small class="form-text text-muted ml-1">
                已经有账号？
                <a href="{% url 'user:login' %}" style="color: cornflowerblue;">
                    返回登录
                </a>
            </small>
        </div>
    </div>
</div>
{% endblock content %}
