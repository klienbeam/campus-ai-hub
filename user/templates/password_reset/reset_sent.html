{% extends "password_reset/base.html" %}
{% load i18n %}

{% block title %}{% trans "Password recovery sent" %}{% endblock %}

{% block content %}
<div class="container mt-5">
	<div class="row justify-content-center">
		<div class="col-md-6 text-center">
			<h2 class="mb-4">邮箱验证</h2>
			<div class="alert alert-success text-center" role="alert">
				<p style="font-size: 17px; margin: 0;">
					{% blocktrans with ago=timestamp|timesince %}
					{{ ago }} 前一封邮件已发送到 <strong>{{ email }}</strong><br>请使用邮件中的链接设置新密码
					{% endblocktrans %}
				</p>
			</div>
			<a href="{% url 'user:login' %}" class="btn btn-primary mt-3">返回登录</a>
		</div>
	</div>
</div>
{% endblock %}
